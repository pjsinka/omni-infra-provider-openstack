[[local|localrc]]
# Minimal DevStack for omni-infra-provider e2e: Keystone, Glance, Nova,
# Neutron (OVN), Cinder, Placement — the devstack defaults (stable/2026.2)
# minus dashboard, test framework and monitoring.
#
# install.sh PREPENDS the per-run generated values (ADMIN_PASSWORD must be
# defined before the $ADMIN_PASSWORD references below — localrc is evaluated
# in file order):
#   ADMIN_PASSWORD=<random per run>
#   LIBVIRT_TYPE=kvm|qemu   (detected via /dev/kvm presence)

# Single-node loopback cloud; the CI runner has no stable host address.
HOST_IP=127.0.0.1

# Password indirection: ADMIN_PASSWORD is the only real value (injected by
# install.sh); this shell-evaluated section references it.
DATABASE_PASSWORD=$ADMIN_PASSWORD
RABBIT_PASSWORD=$ADMIN_PASSWORD
SERVICE_PASSWORD=$ADMIN_PASSWORD

# Devstack defaults minus horizon (dashboard), tempest (test framework,
# download-only by default) and dstat (monitoring daemon).
disable_service horizon tempest dstat

# The provider imports its own image from Omni's URL — no cirros needed.
DOWNLOAD_DEFAULT_IMAGES=False

# Machines boot from Cinder volumes (disk_size: 10) — give the loopback
# volume group headroom beyond a single 10G boot volume.
VOLUME_BACKING_FILE_SIZE=20480M

# 2-core CI runners are slow; give services more time to come up.
SERVICE_TIMEOUT=120

# One-shot CI runs do not need the full git history of every service.
GIT_DEPTH=1
