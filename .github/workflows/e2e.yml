name: e2e
# Tier-2 end-to-end pipeline: DevStack + Omni + provider binary + the e2e
# Go test (provision + deprovision a machine through the provider).
# Runs nightly at 03:00 UTC and on demand; the throwaway spike workflow
# that proved this stack (Runs 15-22) was removed when this landed.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
concurrency:
  group: e2e
  cancel-in-progress: true
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: DevStack (Keystone, Glance, Nova, Neutron/OVN, Cinder, Placement)
        run: scripts/devstack/install.sh --cloud-name devstack-e2e --workdir /tmp/devstack

      - name: Install omni + omnictl
        run: scripts/omni/install-omni.sh --workdir /tmp/omni

      - name: Start omni (sudo, TUN) + bootstrap admin SA
        run: scripts/omni/start-omni.sh --workdir /tmp/omni --key-out /tmp/omni/bootstrap-sa.key

      - name: Register infra provider (bootstrap SA -> provider SA key)
        run: |
          set -euo pipefail
          echo "::add-mask::$(sudo cat /tmp/omni/bootstrap-sa.key)"
          export OMNI_ENDPOINT=https://localhost:8080
          export OMNI_SERVICE_ACCOUNT_KEY="$(sudo cat /tmp/omni/bootstrap-sa.key)"
          /tmp/omni/bin/omnictl --insecure-skip-tls-verify infraprovider create openstack --ttl 24h > /tmp/omni/create.out 2>&1 \
            || { sed -E 's/^(OMNI_SERVICE_ACCOUNT_KEY=).*/\1***masked***/' /tmp/omni/create.out; exit 1; }
          sed -n 's/^OMNI_SERVICE_ACCOUNT_KEY=//p' /tmp/omni/create.out > /tmp/omni/provider-sa.key
          echo "::add-mask::$(cat /tmp/omni/provider-sa.key)"
          test -s /tmp/omni/provider-sa.key && echo "provider key extracted: $(wc -c < /tmp/omni/provider-sa.key) bytes"

      - name: Build provider
        run: make build

      - name: Provider check-cloud (OpenStack auth via our binary)
        run: ./bin/provider check-cloud --cloud devstack-e2e

      - name: Run provider (connects to omni + OpenStack)
        run: |
          nohup ./bin/provider \
            --omni-api-endpoint https://localhost:8080 \
            --omni-service-account-key "$(cat /tmp/omni/provider-sa.key)" \
            --cloud devstack-e2e \
            --insecure-skip-verify > /tmp/omni/provider.log 2>&1 &
          for _ in $(seq 1 60); do
            grep -q "starting infra provider" /tmp/omni/provider.log && break
            sleep 2
          done
          grep -q "starting infra provider" /tmp/omni/provider.log
          echo '--- provider.log ---'
          cat /tmp/omni/provider.log

      - name: CONNECTED proof (omni sees the provider)
        run: |
          export OMNI_ENDPOINT=https://localhost:8080
          export OMNI_SERVICE_ACCOUNT_KEY="$(sudo cat /tmp/omni/bootstrap-sa.key)"
          for _ in $(seq 1 12); do
            /tmp/omni/bin/omnictl --insecure-skip-tls-verify infraprovider list > /tmp/omni/list.txt 2>/tmp/omni/list.err || true
            grep -qE 'OpenStack infrastructure provider +true' /tmp/omni/list.txt && break
            sleep 10
          done
          cat /tmp/omni/list.txt
          if ! grep -qE 'OpenStack infrastructure provider +true' /tmp/omni/list.txt; then
            echo '--- omnictl stderr ---'
            cat /tmp/omni/list.err || true
            exit 1
          fi

      - name: E2E tests (provision + deprovision via make test-e2e)
        run: |
          set -euo pipefail
          export OMNI_ENDPOINT=https://localhost:8080
          export OMNI_SERVICE_ACCOUNT_KEY="$(sudo cat /tmp/omni/bootstrap-sa.key)"
          export OMNICTL_BIN=/tmp/omni/bin/omnictl
          # OS_CLOUD and OS_CLIENT_CONFIG_FILE are exported by the DevStack
          # step via GITHUB_ENV (install.sh) and inherited here.
          make test-e2e

      - name: Log tails (diagnostics)
        if: always()
        run: |
          echo '--- provider.log (last 100) ---'
          tail -n 100 /tmp/omni/provider.log 2>/dev/null || true
          echo '--- omni.log (last 50) ---'
          tail -n 50 /tmp/omni/omni.log 2>/dev/null || true

      - name: Teardown
        if: always()
        run: |
          pkill -f bin/provider || true
          sudo pkill -f '/tmp/omni/bin/omni' || true
          sudo /tmp/devstack/devstack/unstack.sh || true
          sudo /tmp/devstack/devstack/clean.sh || true
