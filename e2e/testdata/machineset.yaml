# MachineSet allocating one machine from the omni-e2e-mc machine class.
# Field names (updatestrategy, machineallocation, allocationtype) and BOTH
# labels follow the official Omni example from "Write an Infrastructure
# Providers" (docs.sidero.dev,
# omni/infrastructure-and-extensions/writing-infrastructure-providers):
# - omni.sidero.dev/cluster: Omni validates the referenced cluster exists
#   (Run 16 failed without the label).
# - omni.sidero.dev/role-controlplane with an empty value: Omni rejects
#   machine sets carrying neither role-controlplane nor role-worker
#   (Run 18 failed without it). The machine becomes the cluster's single
#   control plane node.
# updatestrategy 1 = Rolling, allocationtype 0 = static allocation.
#
# Applying this resource makes Omni create a MachineRequest which our
# provider provisions as a Nova server (flavor m1.small, boot volume 10G,
# port with security group e2e-sg in network "private").
metadata:
    namespace: default
    type: MachineSets.omni.sidero.dev
    id: omni-e2e-ms
    labels:
        omni.sidero.dev/cluster: omni-e2e
        omni.sidero.dev/role-controlplane:
spec:
    updatestrategy: 1
    machineallocation:
        name: omni-e2e-mc
        machinecount: 1
        allocationtype: 0
