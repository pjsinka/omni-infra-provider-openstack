# MachineSet allocating one machine from the omni-e2e-mc machine class.
# Field names (updatestrategy, machineallocation, allocationtype) follow the
# official Omni example from "Write an Infrastructure Providers"
# (docs.sidero.dev, omni/infrastructure-and-extensions/writing-infrastructure-providers):
# updatestrategy 1 = Rolling, allocationtype 0 = static allocation.
#
# The omni.sidero.dev/cluster label is REQUIRED: Omni validates that the
# referenced cluster exists (Run 16 failed with "label omni.sidero.dev/cluster
# does not exist" / "the cluster \"\" does not exist" without it). The cluster
# itself is created from cluster.template.yaml by the same workflow step.
#
# Applying this resource makes Omni create a MachineRequest which our
# provider provisions as a Nova server (flavor m1.small, boot volume 10G,
# port with security group e2e-sg in network "private").
metadata:
    namespace: default
    type: MachineSets.omni.sidero.dev
    id: omni-e2e-ms
    labels:
        omni.sidero.dev/cluster: omni-e2e
spec:
    updatestrategy: 1
    machineallocation:
        name: omni-e2e-mc
        machinecount: 1
        allocationtype: 0
